services:
  app:
    container_name: laravel-13-mantine-app
    expose:
      - 9000
    volumes:
      - .:/var/www/html
    build:
      context: .
      dockerfile: ./docker/docker.prod.Dockerfile
    command: >
      bash -c "
      composer install --no-dev --optimize-autoloader;
      npm install;
      npm run build;
      php artisan migrate --force;
      php-fpm -R;"
    restart: "no"
    depends_on:
      - db

  nginx:
    container_name: laravel-13-mantine-nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    depends_on:
      - app

  db:
    image: mysql:8
    container_name: laravel-13-mantine-db
    ports:
      - "3306:3306"
    restart: "no"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
